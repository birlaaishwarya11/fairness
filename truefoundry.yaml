name: fairsight-backend
type: service

image:
  type: build
  build_source:
    type: local
  build_spec:
    type: dockerfile
    dockerfile_path: Dockerfile

ports:
  - port: 8000
    expose: true
    protocol: HTTP

env:
  - name: TAVILY_API_KEY
    value:
      type: secret
      secret_name: tavily-api-key

  - name: DAYTONA_API_KEY
    value:
      type: secret
      secret_name: daytona-api-key

  - name: DAYTONA_SERVER_URL
    value: "https://app.daytona.io/api"

  - name: ALLOWED_ORIGINS
    value: "*"  # Replace with your Lovable app URL in production: "https://your-app.lovable.app"

  - name: ENVIRONMENT
    value: "prod"

  # Max concurrent suite sandboxes — keeps Daytona disk usage bounded
  - name: MAX_CONCURRENT_SUITES
    value: "3"

resources:
  cpu_request: 0.5
  cpu_limit: 2
  memory_request: 512
  memory_limit: 2048

replicas: 1

# Give the pre-stop hook time to delete sandboxes before the pod is killed.
# Without this the pod is SIGKILLed after 30s (k8s default), orphaning sandboxes.
termination_grace_period_seconds: 120

lifecycle:
  pre_stop:
    # Calls the admin cleanup endpoint synchronously before the pod shuts down.
    # Deletes all active Daytona sandboxes so they don't accumulate across deploys.
    exec:
      command:
        - sh
        - -c
        - "curl -sf -X DELETE http://localhost:8000/admin/sandboxes || true"
