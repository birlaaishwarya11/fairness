name: fairsight-backend
type: service

image:
  type: build
  build_source:
    type: local
  build_spec:
    type: dockerfile
    dockerfile_path: Dockerfile

ports:
  - port: 8000
    expose: true
    protocol: HTTP

env:
  - name: TAVILY_API_KEY
    value:
      type: secret
      secret_name: tavily-api-key

  - name: DAYTONA_API_KEY
    value:
      type: secret
      secret_name: daytona-api-key

  - name: DAYTONA_SERVER_URL
    value: "https://app.daytona.io/api"

  - name: ALLOWED_ORIGINS
    value: "https://your-app.lovable.app"

resources:
  cpu_request: 0.5
  cpu_limit: 2
  memory_request: 512
  memory_limit: 2048

replicas: 1
